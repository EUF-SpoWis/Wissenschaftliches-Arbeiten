<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gesetz der großen Zahlen</title><style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f2f4f7;margin:0;padding:20px;color:#222}
.tool{max-width:900px;margin:auto;background:white;border:1px solid #ccc;border-radius:10px;padding:20px}
h1{margin-top:0} h2{margin-top:24px}
.steuerung{background:#f7f7f7;border:1px solid #ddd;border-radius:8px;padding:12px;margin:14px 0}
label{display:block;font-weight:bold;margin-top:10px}
input[type=range],select{width:100%;margin-top:5px}
button,select,input[type=number]{padding:8px;margin-top:8px}
button{cursor:pointer;margin-right:5px}
canvas{width:100%;height:auto;border:1px solid #999;background:white;margin-top:10px}
.werte{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.wert{background:#eee;border-radius:6px;padding:10px}
.wert strong{display:block;margin-bottom:4px}
.hinweis{background:#eef4ff;border-left:4px solid #3d6fd8;padding:10px;margin-top:12px}
.warnung{background:#fff2e7;border-left:4px solid #d9730d;padding:10px;margin-top:12px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{border:1px solid #ccc;padding:7px;text-align:left}
.punkt{display:inline-block;width:13px;height:13px;border-radius:50%;margin:2px;background:#2864dc}
.antwort{display:block;width:100%;text-align:left;margin-top:7px}
.richtig{background:#dff5e5}.falsch{background:#fde3e0}
@media(max-width:650px){.werte{grid-template-columns:1fr 1fr}}
</style></head>
<body><div class="tool"><h1>Gesetz der großen Zahlen</h1><p>Simuliere Münzwürfe und beobachte die relative Häufigkeit.</p>
<div class="steuerung"><button id="eins">1 Wurf</button><button id="zwanzig">20 Würfe</button><button id="hundert">100 Würfe</button><button id="reset">Zurücksetzen</button></div>
<canvas id="c" width="820" height="380"></canvas>
<div class="werte"><div class="wert"><strong>Würfe</strong><span id="w"></span></div><div class="wert"><strong>Kopf</strong><span id="k"></span></div><div class="wert"><strong>Anteil Kopf</strong><span id="a"></span></div><div class="wert"><strong>Theoretisch</strong><span>50 %</span></div></div>
</div><script>
const c=document.getElementById("c"),ctx=c.getContext("2d");let w=0,k=0,v=[];
function werfen(n){for(let i=0;i<n;i++){w++;if(Math.random()<.5)k++;v.push(k/w);if(v.length>500)v.shift()}zeichnen()}
function zeichnen(){ctx.clearRect(0,0,c.width,c.height);let y50=180;ctx.strokeStyle="#cc3333";ctx.beginPath();ctx.moveTo(50,y50);ctx.lineTo(780,y50);ctx.stroke();ctx.fillText("50 %",10,y50+4);
 if(v.length>1){ctx.strokeStyle="#2864dc";ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<v.length;i++){let x=50+i/(v.length-1)*730,y=30+(1-v[i])*300;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
 document.getElementById("w").textContent=w;document.getElementById("k").textContent=k;document.getElementById("a").textContent=(w?k/w*100:0).toFixed(1).replace(".",",")+" %"}
document.getElementById("eins").onclick=()=>werfen(1);document.getElementById("zwanzig").onclick=()=>werfen(20);document.getElementById("hundert").onclick=()=>werfen(100);document.getElementById("reset").onclick=()=>{w=0;k=0;v=[];zeichnen()};zeichnen();
</script></body></html>
