<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forschungsdesign zusammenstellen</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2933; --muted: #64748b; --card: #f3f6fa; --line: #cbd5e1;
    --pt: #2563eb; --out: #dc2626; --ok: #16a34a; --warn: #ea580c; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111827; --fg: #e5e7eb; --muted: #94a3b8; --card: #1f2937; --line: #475569;
            --pt: #60a5fa; --out: #f87171; --ok: #4ade80; --warn: #fb923c; --accent: #60a5fa; }
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg);
         margin: 0; padding: 16px; line-height: 1.5; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--accent); color: #fff;
         font-size: .75rem; font-weight: 600; }
  .card { background: var(--card); border-radius: 14px; padding: 12px 16px; margin-top: 14px; }
  .card h2 { font-size: 1.05rem; margin: 0 0 8px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; align-items: center; }
  .seg > span { min-width: 82px; color: var(--muted); font-size: .9rem; }
  .seg button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
                              color: var(--fg); cursor: pointer; font-size: .9rem; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
  .result { padding: 10px 12px; border-radius: 10px; background: var(--bg); border-left: 4px solid var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dein Forschungsdesign zusammenstellen</h1>
  <p class="sub">Wähle je eine Möglichkeit für <b>Wann</b>, <b>wo</b> und <b>wie stark greife ich ein</b> und sieh, wie dein Design heißt.</p>

  <div class="card">
    <h2>Dein Design zusammenstellen</h2>
    <div class="seg" id="segZeit"><span>Zeitpunkt</span></div>
    <div class="seg" id="segOrt"><span>Umgebung</span></div>
    <div class="seg" id="segArt"><span>Eingriff</span></div>
    <div class="result" id="result"></div>
  </div>
</div>

<script>
// ---------- Inhalte ----------
const groups = [
  { id: 'zeit', title: '1 · Wann?', q: 'Messzeitpunkte', options: [
    { key: 'Querschnitt', svg: 'quer', name: 'Querschnittstudie',
      def: 'Einmalige Messung zu einem Zeitpunkt bei mehreren Personen.',
      ex: 'Beispiel: Alle Teilnehmenden laufen einmal 12 Minuten, und die Strecken werden verglichen.' },
    { key: 'Längsschnitt', svg: 'laeng', name: 'Längsschnittstudie',
      def: 'Wiederholte Messung derselben Personen über mehrere Zeitpunkte (z. B. Prä-Post-Design).',
      ex: 'Beispiel: Cooper-Test vor und nach einem achtwöchigen Ausdauertraining.' } ] },
  { id: 'ort', title: '2 · Wo?', q: 'Umgebung', options: [
    { key: 'Feld', svg: 'feld', name: 'Feldstudie',
      def: 'Natürliche, reale Umgebung (z. B. Trainingsplatz, Wettkampf).',
      ex: 'Vorteil: hohe Alltagsnähe. Nachteil: Störfaktoren wie Wetter sind schwer zu kontrollieren.' },
    { key: 'Labor', svg: 'labor', name: 'Laborstudie',
      def: 'Kontrollierte, künstliche Umgebung (z. B. Diagnostiklabor).',
      ex: 'Vorteil: gut kontrollierbar. Nachteil: Ergebnisse lassen sich weniger leicht auf den Alltag übertragen.' } ] },
  { id: 'art', title: '3 · Wie stark greife ich ein?', q: 'Eingriff', options: [
    { key: 'Experiment', svg: 'exp', name: 'Experiment',
      def: 'Forschende manipulieren aktiv einen Faktor (z. B. Trainingsart) und teilen die Personen zufällig zu (Randomisierung).',
      ex: 'Nur hier sind Aussagen über Ursache und Wirkung am besten abgesichert.' },
    { key: 'Quasi-Experiment', svg: 'quasi', name: 'Quasi-Experiment',
      def: 'Ein Faktor wird manipuliert oder Gruppen werden verglichen, aber ohne Randomisierung (z. B. zwei bereits bestehende Schulklassen).',
      ex: 'Die Gruppen können sich schon vorher unterscheiden, deshalb sind Ursache-Wirkung-Aussagen schwächer.' },
    { key: 'Nicht-Experiment', svg: 'korr', name: 'Nicht-Experiment / Korrelative Studie',
      def: 'Keine Manipulation des Faktors, es werden nur bestehende Unterschiede gemessen.',
      ex: 'Man findet Zusammenhänge, aber keine Kausalität.' } ] }
];

// ---------- Konfigurator ----------
const sel = { zeit: 'Querschnitt', ort: 'Feld', art: 'Experiment' };
const segIds = { zeit: 'segZeit', ort: 'segOrt', art: 'segArt' };
function renderSeg() {
  groups.forEach(g => {
    const el = document.getElementById(segIds[g.id]);
    el.querySelectorAll('button').forEach(b => b.remove());
    g.options.forEach(o => {
      const b = document.createElement('button');
      b.textContent = o.key; b.setAttribute('aria-pressed', sel[g.id] === o.key);
      b.onclick = () => { sel[g.id] = o.key; renderSeg(); renderResult(); };
      el.appendChild(b);
    });
  });
}
function renderResult() {
  const ortWort = sel.ort === 'Feld' ? 'im Feld' : 'im Labor';
  const zeitAdj = sel.zeit === 'Querschnitt' ? 'querschnittliche' : 'längsschnittliche';
  let name;
  if (sel.art === 'Experiment') name = `${zeitAdj.charAt(0).toUpperCase() + zeitAdj.slice(1)}s ${sel.ort === 'Feld' ? 'Feldexperiment' : 'Laborexperiment'}`;
  else if (sel.art === 'Quasi-Experiment') name = `${zeitAdj.charAt(0).toUpperCase() + zeitAdj.slice(1)}s Quasi-Experiment ${ortWort}`;
  else name = `${zeitAdj.charAt(0).toUpperCase() + zeitAdj.slice(1)} korrelative Studie ${ortWort}`;
  const kausal = sel.art === 'Experiment' ? 'Starke Basis für Ursache-Wirkung-Aussagen.'
               : sel.art === 'Quasi-Experiment' ? 'Eingeschränkte Ursache-Wirkung-Aussagen, da keine Zufallszuteilung.'
               : 'Es sind Aussagen über Zusammenhänge möglich, aber nicht über Ursachen.';
  document.getElementById('result').innerHTML =
    `<b>${name}</b><br>` +
    `<span class="tag">${sel.zeit}</span> <span class="tag">${sel.ort}</span> <span class="tag">${sel.art}</span><br>` +
    `<span style="color:var(--muted)">${kausal} Die drei Entscheidungen sind unabhängig voneinander kombinierbar.</span>`;
}

renderSeg(); renderResult();
</script>
</body>
</html>
